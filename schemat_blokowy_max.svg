<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="strzalka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="440" height="470" fill="#ffffff"/>

  <!-- START -->
  <ellipse cx="220" cy="40" rx="65" ry="24" fill="#d4edda" stroke="#2e7d32" stroke-width="2"/>
  <text x="220" y="45" text-anchor="middle" font-weight="bold">START</text>

  <line x1="220" y1="64" x2="220" y2="98" stroke="#333" stroke-width="2" marker-end="url(#strzalka)"/>

  <!-- Wczytaj a, b -->
  <polygon points="165,100 295,100 275,145 145,145" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="220" y="128" text-anchor="middle">Wczytaj a, b</text>

  <line x1="220" y1="145" x2="220" y2="173" stroke="#333" stroke-width="2" marker-end="url(#strzalka)"/>

  <!-- Decyzja -->
  <polygon points="220,175 300,220 220,265 140,220" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="220" y="225" text-anchor="middle" font-weight="bold">a &gt; b ?</text>

  <!-- TAK (lewo) -->
  <polyline points="140,220 90,220 90,293" fill="none" stroke="#333" stroke-width="2" marker-end="url(#strzalka)"/>
  <text x="112" y="210" text-anchor="middle" fill="#2e7d32" font-weight="bold">TAK</text>

  <!-- NIE (prawo) -->
  <polyline points="300,220 350,220 350,293" fill="none" stroke="#333" stroke-width="2" marker-end="url(#strzalka)"/>
  <text x="328" y="210" text-anchor="middle" fill="#c62828" font-weight="bold">NIE</text>

  <!-- Wypisz a -->
  <polygon points="45,295 155,295 135,340 25,340" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="90" y="323" text-anchor="middle">Wypisz a</text>

  <!-- Wypisz b -->
  <polygon points="305,295 415,295 395,340 285,340" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="350" y="323" text-anchor="middle">Wypisz b</text>

  <!-- Połączenie -->
  <polyline points="90,340 90,375 220,375" fill="none" stroke="#333" stroke-width="2"/>
  <polyline points="350,340 350,375 220,375" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="220" y1="375" x2="220" y2="404" stroke="#333" stroke-width="2" marker-end="url(#strzalka)"/>

  <!-- STOP -->
  <ellipse cx="220" cy="430" rx="65" ry="24" fill="#f8d7da" stroke="#c62828" stroke-width="2"/>
  <text x="220" y="435" text-anchor="middle" font-weight="bold">STOP</text>
</svg>
